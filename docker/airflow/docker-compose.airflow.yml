x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ../../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW_PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ../../dags:/opt/airflow/project/dags
    - ../../scripts:/opt/airflow/project/scripts
    - ../../src:/opt/airflow/project/src
    - ../../utils:/opt/airflow/project/utils
    - ../../data:/opt/airflow/project/data
    - ../../db:/opt/airflow/project/db
    - ../../config:/opt/airflow/project/config
    - ../../plugins:/opt/airflow/project/plugins
    - ../../logs:/opt/airflow/logs

services:
  airflow-postgres:
    image: postgres:15
    container_name: sentinel-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: sentinel-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate && airflow users create
      --username admin
      --firstname Sentinel
      --lastname Admin
      --role Admin
      --email admin@sentinel.local
      --password admin || true"

  airflow-webserver:
    <<: *airflow-common
    container_name: sentinel-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: sentinel-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow-postgres-data:
